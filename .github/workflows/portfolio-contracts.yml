name: Portfolio Contracts

on:
  push:
    paths:
      - 'api/**'
      - 'web/**'
      - 'contracts/**'
      - 'config/**'
      - 'src/core/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'vercel.json'
      - '.github/workflows/portfolio-contracts.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'web/**'
      - 'contracts/**'
      - 'config/**'
      - 'src/core/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'vercel.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Validate portfolio infrastructure
        run: |
          python -m unittest discover tests -v
          python scripts/portfolio_health.py > /tmp/portfolio-health.json
          python -m json.tool contracts/portfolio-registry.json > /dev/null
          python -m json.tool contracts/event-envelope.schema.json > /dev/null
          python -m json.tool contracts/project-health.schema.json > /dev/null
          python -m json.tool contracts/revenue-event.schema.json > /dev/null
          python -m json.tool contracts/autonomy-policy.schema.json > /dev/null
          python -m json.tool contracts/resource-allocation.schema.json > /dev/null
          python -m json.tool config/autonomy-policy.json > /dev/null
          python -m json.tool config/resource-allocation.json > /dev/null
